# Slow tier: statistical Monte Carlo suite, live reference-library reproduction and
# the full validation report. Manual or nightly; not a PR gate.
name: slow-validation
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - run: uv sync --frozen --all-groups
      - run: uv run --group reference pytest -q -m "statistical or reference"
      - run: uv run options-engine validate --out reports/ci
      - uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/ci
